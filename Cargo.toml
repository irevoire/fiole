[package]
name = "fiole"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
description = "An opinionated wrapper around fjall"
documentation = "https://docs.rs/fiole"
repository = "https://github.com/irevoire/fiole"
authors = ["Tamo <irevoire@hotmail.fr>"]
license = "MIT OR Apache-2.0"
categories = ["database", "api-bindings", "database-implementations"]

[workspace]
members = ["fiole-derive"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
arbitrary = { version = "1.5.0", optional = true }
byteorder = "1.5.0"
byteview = "0.10.2"
facet = { version = "0.46", optional = true }
fiole-derive = { path = "fiole-derive", version = "0.3.0", optional = true }
facet-json = { version = "0.46", optional = true }
facet-postcard = { version = "0.46", optional = true }
facet-msgpack = { version = "0.46", optional = true }
fjall = "3.1.12"
postcard = { version = "1", features = ["alloc", "use-std"], optional = true }
rmp-serde = { version = "1", optional = true }
roaring = { version = "0.11", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
seq-macro = "0.3.6"
paste = "1.0.15"

[features]
default = []
arbitrary = ["dep:arbitrary"]
facet_json = ["facet-json", "facet"]
facet_postcard = ["facet-postcard", "facet"]
facet_msgpack = ["facet-msgpack", "facet"]
# Support for `jiff` 0.2 and `uuid` types in the facet codecs
jiff02 = ["facet?/jiff02"]
uuid = ["facet?/uuid"]
serde_json = ["dep:serde_json", "serde"]
serde_postcard = ["postcard", "serde"]
serde_msgpack = ["rmp-serde", "serde"]
roaring = ["dep:roaring"]
# `#[derive(Fiole)]`, to define a codec from your structure directly
derive = ["dep:fiole-derive"]

[dev-dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
arbtest = "0.3.2"
serde = { version = "1", features = ["derive"] }
tempfile = "3.27.0"
