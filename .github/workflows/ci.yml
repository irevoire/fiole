name: Cargo Fmt, Build and Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - nightly
    steps:
      - uses: actions/checkout@v4
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo build --verbose --workspace --all-targets --all-features
      # The compile errors of the derive are checked on stable only, below:
      # their wording changes with the version of rustc
      - run: cargo test --verbose --workspace --all-targets --all-features --exclude fiole-derive
      # `--all-targets` doesn't run the doctests
      - run: cargo test --verbose --workspace --doc --all-features
      - if: matrix.toolchain == 'stable'
        run: cargo test --verbose -p fiole-derive --all-features --test errors
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo fmt --check --verbose --all
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo doc --workspace --all-features --no-deps
  features:
    name: Feature ${{ matrix.feature }} alone
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - arbitrary
          - facet_json
          - facet_postcard
          - facet_msgpack
          - serde_json
          - serde_postcard
          - serde_msgpack
          - roaring
          - jiff02
          - uuid
          - derive
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo clippy --all-targets --no-default-features --features ${{ matrix.feature }} -- -D warnings
  no_features:
    name: No feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90 && rustup default 1.90
      - run: cargo test --workspace --all-targets --all-features --exclude fiole-derive
      - run: cargo test --workspace --doc --all-features
