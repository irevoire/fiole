[package]
name = "fiole-derive"
description = "The derive macros of fiole"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2"

[dev-dependencies]
fiole = { path = "..", features = ["derive"] }
trybuild = "1"
